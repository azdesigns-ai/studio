    <style>
        :root {
            --color-bg-deep: #0A0E14;
            --color-bg-card: rgba(21, 30, 45, 0.6);
            --color-bg-card-solid: #151E2D;
            --color-accent-teal: #00D4AA;
            --color-accent-teal-hover: #00b895;
            --color-accent-violet: #6C5CE7;
            --color-accent-gold: #C9A961;
            --color-accent-orange: #FF7F50;
            --color-text-primary: #F8F9FA;
            --color-text-secondary: #94A3B8;
            --color-border: rgba(255,255,255,0.08);
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --transition-fast: 0.2s ease;
            --transition-smooth: 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            --shadow-card: 0 20px 40px rgba(0,0,0,0.4);
            --border-radius: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html { 
            scroll-behavior: smooth; 
            scroll-padding-top: 100px;
        }
        
        body {
            font-family: var(--font-body);
            background-color: var(--color-bg-deep);
            color: var(--color-text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-heading);
            font-weight: 600;
            line-height: 1.15;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }
        
        p { font-weight: 300; color: var(--color-text-secondary); line-height: 1.7; }
        a { text-decoration: none; color: inherit; transition: color var(--transition-fast); }

        .container { width: 92%; max-width: 1280px; margin: 0 auto; padding: 0 1rem; }

        /* Buttons */
        button, .btn {
            cursor: pointer; font-family: var(--font-heading); font-weight: 600;
            border-radius: 12px; padding: 16px 32px; transition: all var(--transition-fast);
            font-size: 0.95rem; border: 1px solid transparent;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--color-accent-teal), #00F0C4);
            color: var(--color-bg-deep);
            box-shadow: 0 4px 14px rgba(0, 212, 170, 0.25);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 212, 170, 0.4);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.03); border: 1px solid var(--color-border); color: var(--color-text-primary);
            backdrop-filter: blur(4px);
        }
        .btn-secondary:hover {
            border-color: var(--color-accent-violet); color: var(--color-accent-violet);
            background: rgba(108, 92, 231, 0.1);
        }
        .btn-catalog {
            background: linear-gradient(135deg, var(--color-accent-orange), #FF6347);
            color: white;
            box-shadow: 0 4px 14px rgba(255, 127, 80, 0.25);
        }
        .btn-catalog:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 127, 80, 0.4); }

        /* Header */
        header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            background: rgba(10, 14, 20, 0.85); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--color-border);
        }
        .header-inner { display: flex; justify-content: space-between; align-items: center; height: 80px; }
        
        .brand-wrapper { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .brand-logo-img { height: 40px; width: auto; object-fit: contain; }
        .brand-text { display: flex; flex-direction: column; justify-content: center; line-height: 1.1; }
        .brand-name { font-family: var(--font-heading); font-weight: 700; font-size: 1.25rem; color: var(--color-text-primary); }
        .brand-tagline { font-family: var(--font-mono); font-size: 0.6rem; color: var(--color-accent-teal); text-transform: uppercase; letter-spacing: 0.05em; }

        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-item { position: relative; font-weight: 500; cursor: pointer; font-size: 0.9rem; }
        .nav-item:hover { color: var(--color-accent-teal); }
        
        /* Dropdown */
        .nav-dropdown {
            position: absolute; top: 100%; left: 50%; transform: translateX(-50%) translateY(10px);
            background: var(--color-bg-card-solid); border: 1px solid var(--color-border);
            border-radius: 12px; padding: 0.5rem; min-width: 200px; display: none;
            box-shadow: var(--shadow-card); backdrop-filter: blur(20px); z-index: 1001;
        }
        .nav-dropdown a { display: block; padding: 0.75rem 1rem; font-size: 0.85rem; border-radius: 8px; color: var(--color-text-secondary); }
        .nav-dropdown a:hover { color: var(--color-text-primary); background: rgba(255,255,255,0.05); }
        .nav-item:hover .nav-dropdown { display: block; animation: slideDown 0.2s forwards; }
        @keyframes slideDown { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

        .hamburger { display: none; flex-direction: column; gap: 6px; cursor: pointer; z-index: 1001; }
        .hamburger span { width: 24px; height: 2px; background: var(--color-text-primary); transition: var(--transition-fast); }

        .mobile-menu {
            position: fixed; top: 0; right: -100%; width: 85%; max-width: 320px; height: 100vh;
            background: var(--color-bg-card-solid); z-index: 1000; padding: 100px 2rem 2rem;
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -10px 0 40px rgba(0,0,0,0.8); backdrop-filter: blur(20px);
        }
        .mobile-menu.active { right: 0; }
        .mobile-menu a { display: block; padding: 1.2rem 0; font-size: 1.2rem; border-bottom: 1px solid var(--color-border); font-family: var(--font-heading); }
        .close-mobile { position: absolute; top: 25px; right: 25px; cursor: pointer; font-size: 1.5rem; }

        .sticky-mobile-cta {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--color-accent-teal); color: var(--color-bg-deep);
            padding: 14px 28px; border-radius: 50px; font-weight: 700;
            box-shadow: 0 4px 20px rgba(0, 212, 170, 0.4); z-index: 998;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: var(--font-heading); border: none; cursor: pointer;
            display: none !important;
        }

        /* Background Mesh */
        .bg-mesh {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            background: radial-gradient(circle at 15% 15%, rgba(108, 92, 231, 0.12) 0%, transparent 40%),
                        radial-gradient(circle at 85% 85%, rgba(0, 212, 170, 0.06) 0%, transparent 40%);
            pointer-events: none;
        }

        /* Sections General */
        section {
            padding: 120px 0; opacity: 0; transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease; position: relative; z-index: 2;
        }
        section.visible { opacity: 1; transform: translateY(0); }

        /* HERO SECTION IMPROVEMENTS */
        .hero { padding: 180px 0 120px; text-align: center; }
        .badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(0, 212, 170, 0.08); color: var(--color-accent-teal);
            padding: 8px 16px; border-radius: 50px; font-size: 0.8rem; font-weight: 500;
            margin-bottom: 2.5rem; border: 1px solid rgba(0, 212, 170, 0.15);
            font-family: var(--font-mono); letter-spacing: 0.02em;
        }
        .hero h1 {
            font-size: clamp(3rem, 7vw, 5.5rem); margin-bottom: 1.5rem;
            background: linear-gradient(to right, #fff, #cbd5e1);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.05;
        }
        .hero p.subheadline { font-size: clamp(1.1rem, 2vw, 1.35rem); max-width: 700px; margin: 0 auto 3rem; font-weight: 300; color: var(--color-text-secondary); }
        
        /* Modern Comparison Slider */
        .hero-visual {
            max-width: 1000px; margin: 0 auto; position: relative;
            border-radius: 24px; overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--color-border);
            background: #111;
        }
        .comparison-container {
            position: relative; width: 100%; aspect-ratio: 16 / 9;
            cursor: col-resize; user-select: none;
        }
        .comp-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .comp-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .img-before { z-index: 1; }
        .img-after { z-index: 2; width: 50%; border-right: 2px solid var(--color-accent-teal); overflow: hidden; }
        
        .slider-handle {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 48px; height: 48px; background: rgba(10, 14, 20, 0.8);
            border: 2px solid var(--color-accent-teal); border-radius: 50%;
            z-index: 10; cursor: ew-resize; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(0, 212, 170, 0.3); backdrop-filter: blur(4px);
        }
        .slider-handle::after { content: '↔'; color: var(--color-accent-teal); font-weight: bold; font-size: 1.2rem; }

        /* Floating Labels inside Slider */
        .slider-label-floating {
            position: absolute; top: 20px; padding: 6px 12px;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
            font-family: var(--font-mono); font-size: 0.75rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.05em; z-index: 5; pointer-events: none;
        }
        .label-left { left: 20px; color: var(--color-text-secondary); }
        .label-right { right: 20px; color: var(--color-accent-teal); border-color: rgba(0, 212, 170, 0.3); }

        .trust-bar { color: var(--color-text-secondary); font-size: 0.85rem; font-family: var(--font-mono); opacity: 0.8; margin-top: 2rem; display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap; }

        /* How It Works */
        .how-it-works h2 { text-align: center; font-size: clamp(2.2rem, 4vw, 3.5rem); margin-bottom: 1rem; }
        .how-it-works p.subheadline { text-align: center; margin-bottom: 5rem; font-size: 1.15rem; max-width: 700px; margin-left: auto; margin-right: auto; }
        .process-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 2.5rem; margin-bottom: 4rem; }
        .process-step {
            background: var(--color-bg-card); backdrop-filter: blur(12px);
            border-radius: var(--border-radius); padding: 3rem 2rem;
            border: 1px solid var(--color-border); transition: all 0.3s ease; position: relative;
        }
        .process-step:hover { transform: translateY(-8px); border-color: var(--color-accent-teal); box-shadow: 0 12px 40px rgba(0, 212, 170, 0.1); }
        .step-number { font-family: var(--font-heading); font-size: 4rem; font-weight: 700; color: rgba(255,255,255,0.03); position: absolute; top: 10px; right: 20px; line-height: 1; }
        .process-step h3 { font-size: 1.4rem; margin-bottom: 1rem; }

        /* SERVICES SECTION IMPROVEMENTS */
        .services { padding-top: 80px; }
        .services h2 { text-align: center; font-size: clamp(2.2rem, 4vw, 3.5rem); margin-bottom: 1rem; }
        .services p.subheadline { text-align: center; margin-bottom: 4rem; font-size: 1.15rem; max-width: 700px; margin: 0 auto 4rem auto; }

        /* Improved Deck Layout */
        .image-deck-container {
            position: relative; width: 100%; max-width: 500px; margin: 0 auto 3rem auto;
            aspect-ratio: 4/5; perspective: 1000px; cursor: pointer;
        }
        .deck-item {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 24px; overflow: hidden; border: 1px solid var(--color-border);
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            background: #111; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .deck-img-placeholder { width: 100%; height: 100%; object-fit: cover; }
        .deck-overlay {
            position: absolute; bottom: 0; left: 0; right: 0; padding: 2rem;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            font-family: var(--font-mono); font-size: 0.85rem; color: #fff; text-align: center;
        }

        /* Stack States - Cleaner Offsets */
        .deck-item.state-0 { z-index: 3; transform: scale(1) translateY(0); opacity: 1; border-color: var(--color-accent-teal); }
        .deck-item.state-1 { z-index: 2; transform: scale(0.92) translateY(15px) rotate(3deg); opacity: 0.5; filter: brightness(0.6); }
        .deck-item.state-2 { z-index: 1; transform: scale(0.84) translateY(30px) rotate(6deg); opacity: 0; filter: brightness(0.4); }

        /* Navigation Rail */
        .nav-rail-container {
            width: 100%; overflow-x: auto; padding: 1rem 0 2rem 0; margin-bottom: 2rem;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .nav-rail-container::-webkit-scrollbar { display: none; }
        .nav-rail { display: flex; justify-content: center; gap: 0.75rem; min-width: max-content; padding: 0 1rem; }
        
        .rail-btn {
            background: rgba(255,255,255,0.03); border: 1px solid var(--color-border);
            color: var(--color-text-secondary); padding: 10px 24px; border-radius: 50px;
            font-size: 0.9rem; font-family: var(--font-heading); font-weight: 500;
            cursor: pointer; transition: all 0.2s ease; white-space: nowrap;
        }
        .rail-btn:hover { background: rgba(255,255,255,0.08); color: var(--color-text-primary); }
        .rail-btn.active {
            background: var(--color-accent-teal); color: var(--color-bg-deep);
            border-color: var(--color-accent-teal); font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 212, 170, 0.3);
        }

        /* Context Card */
        .context-card {
            background: var(--color-bg-card); backdrop-filter: blur(16px);
            border: 1px solid var(--color-border); border-radius: 24px;
            padding: 3rem; max-width: 900px; margin: 0 auto;
            transition: all 0.4s ease; opacity: 1; transform: translateY(0);
        }
        .context-card.fade-out { opacity: 0; transform: translateY(10px); }
        .card-header { margin-bottom: 2.5rem; border-bottom: 1px solid var(--color-border); padding-bottom: 1.5rem; }
        .card-title-group h3 { font-size: 2rem; margin-bottom: 0.5rem; }
        .card-sub { font-size: 1rem; color: var(--color-text-secondary); }
        
        .card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; margin-bottom: 2.5rem; }
        .card-section h4 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1rem; font-family: var(--font-heading); display: flex; align-items: center; gap: 0.5rem; }
        .label-challenge { color: var(--color-accent-violet); }
        .label-solution { color: var(--color-accent-teal); }
        .label-cultural { color: var(--color-accent-gold); }
        .card-section p { font-size: 0.95rem; line-height: 1.6; }

        /* Results & Pricing (Minor tweaks) */
        .results h2, .pricing h2, .quality h2, .contact h2 { text-align: center; font-size: clamp(2.2rem, 4vw, 3.5rem); margin-bottom: 1rem; }
        .subheadline { text-align: center; margin-bottom: 4rem; font-size: 1.15rem; max-width: 700px; margin-left: auto; margin-right: auto; }
        
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; margin-bottom: 5rem; }
        .metric-badge { background: var(--color-bg-card); border: 1px solid var(--color-border); padding: 3rem 2rem; border-radius: var(--border-radius); text-align: center; backdrop-filter: blur(12px); }
        .metric-value { font-size: 3.5rem; font-family: var(--font-heading); font-weight: 700; color: var(--color-text-primary); margin-bottom: 0.5rem; }
        
        .case-study { background: var(--color-bg-card); backdrop-filter: blur(12px); padding: 3rem; border-radius: var(--border-radius); margin-bottom: 2rem; border: 1px solid var(--color-border); position: relative; overflow: hidden; }
        .case-study::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--color-accent-teal); }

        /* Pricing Grid */
        .pricing-path-container { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 5rem; }
        .path-column { display: flex; flex-direction: column; gap: 1.5rem; }
        .price-card-small { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--border-radius); padding: 2rem; transition: all 0.3s ease; }
        .price-card-small:hover { border-color: var(--color-accent-teal); transform: translateY(-4px); }
        
        .plans-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2rem; margin-bottom: 5rem; }
        .plan-card { background: var(--color-bg-card); backdrop-filter: blur(12px); padding: 3rem 2rem; border-radius: var(--border-radius); border: 1px solid var(--color-border); display: flex; flex-direction: column; transition: all var(--transition-smooth); }
        .plan-card.popular { border: 1px solid var(--color-accent-violet); box-shadow: 0 8px 32px rgba(108,92,231,0.15); transform: scale(1.05); z-index: 10; }
        
        /* Contact Form */
        .contact { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: 24px; padding: 5rem 3rem; margin-top: 4rem; }
        .contact-form { max-width: 600px; margin: 0 auto; display: grid; gap: 1.5rem; }
        .form-group input, .form-group select { width: 100%; padding: 1.2rem; background: rgba(0,0,0,0.2); border: 1px solid var(--color-border); border-radius: 12px; color: var(--color-text-primary); font-family: var(--font-body); font-size: 1rem; transition: var(--transition-fast); }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--color-accent-teal); box-shadow: 0 0 0 4px rgba(0,212,170,0.1); }

        /* Footer */
        footer { background: #05080C; padding: 4rem 0 2rem; margin-top: 6rem; border-top: 1px solid var(--color-border); }
        .footer-bottom { border-top: 1px solid var(--color-border); padding-top: 2rem; text-align: center; font-size: 0.8rem; color: var(--color-text-secondary); font-family: var(--font-mono); opacity: 0.6; margin-top: 3rem; }

        /* Toast */
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--color-bg-card-solid); border: 1px solid var(--color-accent-teal); color: var(--color-text-primary); padding: 16px 32px; border-radius: 50px; font-family: var(--font-heading); font-weight: 500; z-index: 2000; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px; }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* Mobile Responsive */
        @media (max-width: 900px) {
            .card-grid { grid-template-columns: 1fr; gap: 1.5rem; }
            .pricing-path-container { grid-template-columns: 1fr; }
            .plan-card.popular { transform: scale(1); }
        }

        @media (max-width: 768px) {
            .nav-links, .desktop-cta { display: none; }
            .hamburger { display: flex; }
            .sticky-mobile-cta { display: block !important; }
            
            section { padding: 80px 0; }
            .hero { padding: 140px 0 80px; }
            .hero h1 { font-size: 2.8rem; }
            .hero-visual { margin: 0 -1rem; border-radius: 0; border-left: none; border-right: none; }
            
            .image-deck-container { max-width: 85%; aspect-ratio: 3/4; }
            .deck-item.state-1 { transform: scale(0.9) translateY(10px) rotate(2deg); opacity: 0.4; }
            .deck-item.state-2 { opacity: 0; }
            
            .nav-rail { justify-content: flex-start; }
            .context-card { padding: 2rem 1.5rem; }
            .contact { padding: 3rem 1.5rem; }
            
            .brand-name { font-size: 1.1rem; }
            .brand-tagline { font-size: 0.55rem; }
        }
    </style>
